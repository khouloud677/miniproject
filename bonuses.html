<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Primes</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/dashboard.css">
        <link rel="stylesheet" href="css/modules.css">
    </head>
    <body data-page="bonuses">
        <main class="content">
            <h1>Primes</h1>
            <section class="card panel">
                <h2>Gestion des primes</h2>
                <form class="toolbar" id="f-prime">
                    <select id="p-emp"></select>
                    <input id="p-motif" placeholder="Motif" required>
                    <input id="p-montant" type="number" min="1" placeholder="Montant (DT)" required>
                    <button class="btn">+ Ajouter une prime</button>
                </form>
                <div class="table-scroll">
                    <table id="t-primes"></table>
                </div>
            </section>
        </main>
        <script src="js/layout.js"></script>
        <script src="js/main.js"></script>
        <script src="js/modules.js"></script>
    </body>
</html>
